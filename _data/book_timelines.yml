# _data/book_timelines.yml

# Use the book's slug as the key for its timeline
light-in-the-valley:
  - title: "The Letter Arrives"
    date: "Early Spring"
    description: "Grace Bennett receives word that her mother has passed and the old family house in Willowbrook now belongs to her."
    special_info: "The homecoming begins"

  - title: "Return to Willowbrook"
    date: "Day 1"
    description: "Grace drives back into the Georgia town she swore she'd left for good, intending to settle the estate and leave within a week."
    special_info: ""

  - title: "The Old Chapel"
    date: "Day 3"
    description: "Sorting through her mother's belongings, Grace discovers a bundle of letters that lead her to the crumbling chapel at the edge of town."
    special_info: ""

  - title: "Meeting Thomas"
    date: "Day 4"
    description: "Grace crosses paths with Thomas Bennett, a widowed carpenter hired to assess the chapel's failing roof."
    special_info: ""

  - title: "Old Wounds Resurface"
    date: "Week 2"
    description: "A chance encounter with a face from her past forces Grace to confront the summer that drove her away."
    special_info: ""

  - title: "The Restoration Begins"
    date: "Week 3"
    description: "Against her own plans, Grace agrees to help Thomas restore the chapel, and the work begins to restore something in her as well."
    special_info: ""

  - title: "The Storm"
    date: "Week 6"
    description: "A violent spring storm damages the chapel and lays bare the fears Grace has kept hidden for fifteen years."
    special_info: "The turning point"

  - title: "A Choice to Stay"
    date: "Late Spring"
    description: "With the chapel standing again and her heart no longer frozen, Grace decides that Willowbrook may be home after all."
    special_info: ""

  - title: "The First Light"
    date: "Pentecost Sunday"
    description: "The restored chapel reopens its doors, and Grace steps inside not as a stranger but as one who has finally come home."
    special_info: "A new beginning"

rivers-of-grace:
  - title: "Roots Newly Planted"
    date: "One Year Later"
    description: "Grace has begun to build a quiet, hopeful life in Willowbrook, tending the chapel and the fragile faith she rediscovered."
    special_info: ""

  - title: "A Face from the Past"
    date: "Early Summer"
    description: "Someone Grace never expected to see again arrives in Willowbrook, reopening a wound she believed had finally healed."
    special_info: "The test begins"

  - title: "The Secret at the Ford"
    date: "Midsummer"
    description: "A long-kept family secret surfaces near the old river ford, threatening to unravel everything Grace has rebuilt."
    special_info: ""

  - title: "The River Rises"
    date: "Late Summer"
    description: "Heavy rains swell the river toward the ford, mirroring the flood of memory and grief that Grace can no longer hold back."
    special_info: ""

  - title: "The Reckoning"
    date: "Harvest"
    description: "Grace must choose between the safety of resentment and the terrifying freedom of forgiveness."
    special_info: "The choice"

  - title: "Grace Like Water"
    date: "Autumn"
    description: "In letting go of the wound she guarded longest, Grace discovers that mercy carries her further than she ever meant to go."
    special_info: "A wideness of mercy"
